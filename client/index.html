<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Adaptive DSA Coach</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314110e'/%3E%3Cpath d='M7 18a9 9 0 0 1 18 0z' fill='%23e9a23b'/%3E%3Crect x='14.5' y='19.5' width='3' height='6' rx='1.5' fill='%23a89d8c'/%3E%3C/svg%3E" />
    <script>
      // Set the colour mode before the page paints, so there is no flash of the wrong theme.
      (function () {
        var mode = null;
        try { mode = localStorage.getItem("theme"); } catch (e) {}
        if (mode !== "light" && mode !== "dark") mode = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", mode);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
